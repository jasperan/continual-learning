[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-learning-slm"
version = "0.4.0"
description = "Continual Learning SLM with TTT-E2E and Sparse Memory Finetuning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "jax",
    "jaxlib",
    "questionary",
    "rich",
    "datasets",
    "beautifulsoup4",
    "requests",
    "pyyaml",
    "scikit-learn",
    "peft",
]

[dependency-groups]
dev = [{include-group = "lint"}, {include-group = "test"}]
lint = ["ruff>=0.9", "ty>=0.1"]
test = ["pytest>=8.0", "pytest-cov>=4.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
continual-learning = "continual_learning.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
