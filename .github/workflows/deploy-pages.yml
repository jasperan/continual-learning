name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build interactive app
        working-directory: interactive
        run: |
          npm ci
          npm run build

      - name: Prepare pages output
        run: |
          mkdir -p _site/interactive
          cp -r interactive/out/* _site/interactive/
          cp -r assets/* _site/ 2>/dev/null || true
          echo '<html><head><meta http-equiv="refresh" content="0;url=interactive/"></head></html>' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
